# Release: runs on every push to main (the user merges approved pull requests there) and by hand.
# If module.json's version has no release yet, it publishes one: a full release tagged v<version> with the installable
# zip and module.json. Foundry installs and updates from the permanent manifest
#   https://raw.githubusercontent.com/FridgeboyAI/settlement-manager-module/main/module.json
# so each update only needs a higher version and that version's download URL. A push without a version bump publishes
# nothing and never replaces an existing release's zip.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          m = json.loads(Path("module.json").read_text(encoding="utf-8"))
          version = m["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"version must be MAJOR.MINOR.PATCH, got {version!r}"
          tag = f"v{version}"
          repo = os.environ["GITHUB_REPOSITORY"]
          zip_name = f"{m['id']}-{tag}.zip"
          want_manifest = f"https://raw.githubusercontent.com/{repo}/main/module.json"
          want_download = f"https://github.com/{repo}/releases/download/{tag}/{zip_name}"
          assert m.get("manifest") == want_manifest, f"manifest must be {want_manifest}, got {m.get('manifest')}"
          assert m.get("download") == want_download, f"download must be {want_download}, got {m.get('download')}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"RELEASE_TAG={tag}\nRELEASE_ZIP={zip_name}\n")
          PY

      - name: Skip if this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; bump the version in module.json to publish a new one."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Build the installable zip
        if: env.SKIP != '1'
        shell: bash
        run: |
          zip -q -r "$RELEASE_ZIP" module.json README.md DESCRIPTION.md LICENSE scripts styles lang
          unzip -t "$RELEASE_ZIP"
          test "$(unzip -Z1 "$RELEASE_ZIP" | head -n 1)" = "module.json"

      - name: Publish the release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" --title "Settlement Manager $RELEASE_TAG" \
            --notes-file DESCRIPTION.md --target "$GITHUB_SHA" --latest \
            "$RELEASE_ZIP" module.json
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | tee /tmp/assets.txt
          grep -Fx module.json /tmp/assets.txt
          grep -Fx "$RELEASE_ZIP" /tmp/assets.txt
