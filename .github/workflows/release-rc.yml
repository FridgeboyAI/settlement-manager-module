# Copy to .github/workflows/release-rc.yml in each module repo.
# A push to an rc/<module-id> branch creates a GitHub pre-release. The tag is v<version>-rc<n>, where <version>
# comes from module.json and <n> is the next free number. GitHub creates the tag, so agents never push tags.
# Watch the repo for releases to get GitHub's email. No email setup is needed.
name: Release candidate

on:
  push:
    branches:
      - 'rc/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the next tag
        id: tag
        run: |
          test -f DESCRIPTION.md || { echo "DESCRIPTION.md is missing"; exit 1; }
          VERSION=$(python3 -c 'import json; print(json.load(open("module.json"))["version"])')
          N=1
          while git rev-parse -q --verify "refs/tags/v${VERSION}-rc${N}" >/dev/null; do N=$((N+1)); done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-rc${N}" >> "$GITHUB_OUTPUT"

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$GITHUB_REPOSITORY ${{ steps.tag.outputs.tag }} (ready to test)" \
            --notes-file DESCRIPTION.md
